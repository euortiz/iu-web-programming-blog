<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
    <clipPath id="clipClient"><rect x="30" y="96" width="270" height="448" rx="14"/></clipPath>
    <clipPath id="clipApi"><rect x="430" y="96" width="250" height="448" rx="14"/></clipPath>
    <clipPath id="clipDb"><rect x="780" y="96" width="270" height="448" rx="14"/></clipPath>
  </defs>

  <rect width="1080" height="640" fill="#0b0614"/>

  <text x="540" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#fafafa">DevLog — System Architecture</text>
  <text x="540" y="72" text-anchor="middle" font-size="13" fill="#a1a1aa">Client-to-API data path</text>

  <!-- ============ CLIENT PANEL ============ -->
  <rect x="30" y="96" width="270" height="448" rx="14" fill="#140d22" stroke="#a855f7" stroke-opacity="0.35"/>
  <g clip-path="url(#clipClient)">
    <rect x="30" y="96" width="270" height="66" fill="url(#hdr)"/>
    <text x="46" y="124" font-size="12" letter-spacing="2" fill="#f3e8ff">CLIENT — BROWSER</text>
    <text x="46" y="144" font-size="12" fill="#e9d5ff">Vue 3 SPA · Vite · port 5173</text>
  </g>

  <g font-size="13">
    <rect x="46" y="176" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="60" y="200" fill="#e4e4e7" font-weight="600">Vue Router</text>
    <text x="60" y="220" font-size="10.5" fill="#a1a1aa">SPA routing (/ · /post/:id · /login · /admin)</text>

    <rect x="46" y="246" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="60" y="270" fill="#e4e4e7" font-weight="600">Axios HTTP client</text>
    <text x="60" y="290" font-size="10.5" fill="#a1a1aa">baseURL :8000/api · JSON</text>

    <rect x="46" y="316" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="60" y="340" fill="#e4e4e7" font-weight="600">Composables</text>
    <text x="60" y="360" font-size="10.5" fill="#a1a1aa">usePosts · useComments · useAuth</text>

    <rect x="46" y="386" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="60" y="410" fill="#e4e4e7" font-weight="600">localStorage</text>
    <text x="60" y="430" font-size="10.5" fill="#e879f9">devlog_token (Bearer)</text>
  </g>

  <!-- ============ API PANEL ============ -->
  <rect x="430" y="96" width="250" height="448" rx="14" fill="#140d22" stroke="#a855f7" stroke-opacity="0.35"/>
  <g clip-path="url(#clipApi)">
    <rect x="430" y="96" width="250" height="66" fill="url(#hdr)"/>
    <text x="446" y="124" font-size="12" letter-spacing="2" fill="#f3e8ff">LARAVEL 13 REST API</text>
    <text x="446" y="144" font-size="12" fill="#e9d5ff">port 8000</text>
  </g>

  <g font-size="13">
    <rect x="446" y="176" width="218" height="46" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="460" y="196" fill="#e4e4e7" font-weight="600">CORS</text>
    <text x="460" y="212" font-size="10.5" fill="#a1a1aa">HandleCors middleware</text>

    <rect x="446" y="230" width="218" height="46" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="460" y="250" fill="#e4e4e7" font-weight="600">Sanctum auth</text>
    <text x="460" y="266" font-size="10.5" fill="#e879f9">Bearer token check</text>

    <rect x="446" y="284" width="218" height="46" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="460" y="304" fill="#e4e4e7" font-weight="600">Routes</text>
    <text x="460" y="320" font-size="10.5" fill="#a1a1aa">routes/api.php</text>

    <rect x="446" y="338" width="218" height="46" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="460" y="358" fill="#e4e4e7" font-weight="600">FormRequest</text>
    <text x="460" y="374" font-size="10.5" fill="#a1a1aa">validation rules</text>

    <rect x="446" y="392" width="218" height="46" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="460" y="412" fill="#e4e4e7" font-weight="600">Controllers</text>
    <text x="460" y="428" font-size="10.5" fill="#a1a1aa">Auth · Post · Comment</text>

    <rect x="446" y="446" width="218" height="46" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="460" y="466" fill="#e4e4e7" font-weight="600">Eloquent</text>
    <text x="460" y="482" font-size="10.5" fill="#a1a1aa">User · Post · Comment models</text>
  </g>

  <!-- ============ DB PANEL ============ -->
  <rect x="780" y="96" width="270" height="448" rx="14" fill="#140d22" stroke="#a855f7" stroke-opacity="0.35"/>
  <g clip-path="url(#clipDb)">
    <rect x="780" y="96" width="270" height="66" fill="url(#hdr)"/>
    <text x="796" y="124" font-size="12" letter-spacing="2" fill="#f3e8ff">POSTGRESQL 15</text>
    <text x="796" y="144" font-size="12" fill="#e9d5ff">Docker: devlog-db · port 5432</text>
  </g>

  <g font-size="13">
    <rect x="796" y="176" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="810" y="200" fill="#e4e4e7" font-weight="600">users</text>
    <text x="810" y="220" font-size="10.5" fill="#a1a1aa">single admin account</text>

    <rect x="796" y="246" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="810" y="270" fill="#e4e4e7" font-weight="600">posts</text>
    <text x="810" y="290" font-size="10.5" fill="#a1a1aa">user_id · title · content</text>

    <rect x="796" y="316" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="810" y="340" fill="#e4e4e7" font-weight="600">comments</text>
    <text x="810" y="360" font-size="10.5" fill="#a1a1aa">post_id · author_name · content</text>

    <rect x="796" y="386" width="238" height="58" rx="8" fill="#1b1233" stroke="#a855f7" stroke-opacity="0.25"/>
    <text x="810" y="410" fill="#e4e4e7" font-weight="600">personal_access_tokens</text>
    <text x="810" y="430" font-size="10.5" fill="#e879f9">Sanctum API tokens</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <g stroke="#a855f7" stroke-width="2.5">
    <line x1="302" y1="320" x2="426" y2="320" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="682" y1="320" x2="776" y2="320" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>

  <text x="364" y="298" text-anchor="middle" font-size="12.5" fill="#e4e4e7" font-weight="600">HTTP · REST · JSON</text>
  <text x="364" y="352" text-anchor="middle" font-size="12" fill="#e879f9">Bearer token (Sanctum)</text>

  <text x="729" y="298" text-anchor="middle" font-size="12.5" fill="#e4e4e7" font-weight="600">SQL (PDO)</text>
  <text x="729" y="352" text-anchor="middle" font-size="12" fill="#a1a1aa">Eloquent ORM</text>

  <text x="540" y="590" text-anchor="middle" font-size="12" fill="#a1a1aa">Authentication: the single admin signs in via POST /api/login → Sanctum issues a bearer token stored in localStorage (devlog_token), which protected post-management requests send back.</text>
  <text x="540" y="610" text-anchor="middle" font-size="12" fill="#a1a1aa">Guests read posts and post comments unauthenticated; only post CRUD requires the token.</text>
</svg>
