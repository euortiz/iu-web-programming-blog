<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="system-ui, sans-serif">
  <title>DevLog wireframe - Post reading and comments</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="900" height="640" fill="#0b0614"/>
  <rect x="0" y="0" width="900" height="640" fill="url(#glow)"/>

  <!-- NAVBAR -->
  <rect x="0" y="0" width="900" height="56" fill="#140d22"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#a855f7" stroke-opacity="0.25"/>
  <text x="24" y="35" font-size="20" font-weight="700" fill="url(#brand)">DevLog</text>
  <text x="716" y="34" font-size="14" font-weight="600" fill="#c084fc">Home</text>
  <rect x="716" y="42" width="34" height="2" rx="1" fill="#c084fc"/>
  <text x="798" y="34" font-size="14" fill="#a1a1aa">Admin</text>
  <rect x="130" y="48" width="70" height="16" rx="8" fill="#1c1430" stroke="#52525b"/>
  <text x="165" y="59.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#a1a1aa">NAVBAR</text>

  <!-- ARTICLE -->
  <rect x="40" y="68" width="820" height="278" rx="12" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <rect x="52" y="78" width="80" height="16" rx="8" fill="#1c1430" stroke="#52525b"/>
  <text x="92" y="89.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#a1a1aa">ARTICLE</text>
  <rect x="52" y="100" width="90" height="8" rx="4" fill="#52525b"/>
  <rect x="52" y="116" width="560" height="26" rx="6" fill="#fafafa" fill-opacity="0.85"/>

  <!-- AUTHOR/DATE BADGE -->
  <rect x="52" y="156" width="200" height="26" rx="13" fill="#1c1430" stroke="#a855f7" stroke-opacity="0.5"/>
  <circle cx="70" cy="169" r="8" fill="#a855f7" fill-opacity="0.6"/>
  <rect x="86" y="165" width="64" height="8" rx="4" fill="#d4d4d8"/>
  <rect x="160" y="165" width="62" height="8" rx="4" fill="#71717a"/>
  <rect x="268" y="161" width="150" height="16" rx="8" fill="#1c1430" stroke="#52525b"/>
  <text x="343" y="172.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#a1a1aa">AUTHOR/DATE BADGE</text>

  <!-- Body paragraphs -->
  <rect x="52" y="200" width="796" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="214" width="700" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="236" width="780" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="250" width="740" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="272" width="796" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="286" width="760" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="300" width="420" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="322" width="790" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="336" width="300" height="7" rx="3.5" fill="#3f3f46"/>

  <!-- COMMENTS -->
  <rect x="40" y="358" width="820" height="156" rx="12" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <rect x="52" y="368" width="90" height="16" rx="8" fill="#1c1430" stroke="#52525b"/>
  <text x="97" y="379.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#a1a1aa">COMMENTS</text>
  <text x="52" y="406" font-size="15" font-weight="700" fill="#fafafa">Comments</text>

  <!-- Comment item 1 -->
  <rect x="52" y="420" width="96" height="9" rx="4" fill="#d4d4d8"/>
  <rect x="784" y="421" width="64" height="7" rx="3.5" fill="#52525b"/>
  <rect x="52" y="436" width="700" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="448" width="520" height="7" rx="3.5" fill="#3f3f46"/>
  <line x1="52" y1="464" x2="848" y2="464" stroke="#a855f7" stroke-opacity="0.15"/>

  <!-- Comment item 2 -->
  <rect x="52" y="474" width="110" height="9" rx="4" fill="#d4d4d8"/>
  <rect x="784" y="475" width="64" height="7" rx="3.5" fill="#52525b"/>
  <rect x="52" y="490" width="640" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="52" y="502" width="380" height="7" rx="3.5" fill="#3f3f46"/>

  <!-- COMMENT FORM -->
  <rect x="40" y="524" width="820" height="108" rx="12" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-dasharray="5 4"/>
  <rect x="52" y="534" width="118" height="16" rx="8" fill="#1c1430" stroke="#52525b"/>
  <text x="111" y="545.5" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1.2" fill="#a1a1aa">COMMENT FORM</text>
  <rect x="52" y="556" width="250" height="28" rx="6" fill="#0b0614" stroke="#3f3f46"/>
  <text x="64" y="574" font-size="12" fill="#71717a">Display name</text>
  <rect x="52" y="592" width="250" height="28" rx="6" fill="url(#brand)"/>
  <text x="177" y="610" text-anchor="middle" font-size="12" font-weight="700" fill="#fafafa">Post comment</text>
  <rect x="318" y="556" width="530" height="64" rx="6" fill="#0b0614" stroke="#3f3f46"/>
  <text x="330" y="574" font-size="12" fill="#71717a">Write your comment...</text>
  <rect x="330" y="588" width="300" height="7" rx="3.5" fill="#27272a"/>
  <rect x="330" y="602" width="200" height="7" rx="3.5" fill="#27272a"/>
</svg>
